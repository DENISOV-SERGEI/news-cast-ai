<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="880" height="130" role="img" aria-label="Схема пайплайна news-cast-ai: RSS → LLM → Image → Publish → Site">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- фон -->
  <rect width="880" height="130" rx="16" fill="url(#bg)"/>

  <!-- блоки пайплайна -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="18" y="38" width="120" height="42" rx="9" fill="#2563eb"/>
    <text x="78" y="64" fill="#ffffff">RSS / HTML</text>

    <rect x="196" y="38" width="120" height="42" rx="9" fill="#7c3aed"/>
    <text x="256" y="64" fill="#ffffff">LLM 2-stage</text>

    <rect x="374" y="38" width="120" height="42" rx="9" fill="#db2777"/>
    <text x="434" y="64" fill="#ffffff">Image gen</text>

    <rect x="552" y="38" width="120" height="42" rx="9" fill="#059669"/>
    <text x="612" y="64" fill="#ffffff">Publish ×5</text>

    <rect x="730" y="38" width="132" height="42" rx="9" fill="#d97706"/>
    <text x="796" y="64" fill="#ffffff">Site + Deploy</text>
  </g>

  <!-- стрелки -->
  <g stroke="#64748b" stroke-width="2.5" stroke-linecap="round">
    <line x1="138" y1="59" x2="196" y2="59"/>
    <line x1="316" y1="59" x2="374" y2="59"/>
    <line x1="494" y1="59" x2="552" y2="59"/>
    <line x1="672" y1="59" x2="730" y2="59"/>
  </g>

  <!-- анимированные точки, бегущие по стрелкам -->
  <g fill="#4ade80">
    <circle r="4.5">
      <animateMotion dur="1.4s" repeatCount="indefinite" path="M138,59 L196,59"/>
    </circle>
    <circle r="4.5">
      <animateMotion dur="1.4s" begin="0.35s" repeatCount="indefinite" path="M316,59 L374,59"/>
    </circle>
    <circle r="4.5">
      <animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite" path="M494,59 L552,59"/>
    </circle>
    <circle r="4.5">
      <animateMotion dur="1.4s" begin="1.05s" repeatCount="indefinite" path="M672,59 L730,59"/>
    </circle>
  </g>

  <!-- пульсирующая точка "LIVE" -->
  <g>
    <circle cx="30" cy="108" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#f87171">LIVE · 24/7</text>
  </g>

  <!-- нижняя полоса прогресса -->
  <rect x="18" y="120" width="844" height="4" rx="2" fill="#334155"/>
  <rect x="18" y="120" width="844" height="4" rx="2" fill="url(#bar)">
    <animate attributeName="width" values="0;844" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
